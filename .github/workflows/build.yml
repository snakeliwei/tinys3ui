name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # arm64 runner 上交叉编译双架构，lipo 合成通用二进制
          - os: macos-latest
            artifact: macos-universal
          - os: windows-latest
            artifact: windows-x86_64
          # ubuntu-latest 自 2026-10-19 起指向 Ubuntu 26.04，gpui 尚未在其上验证过，
          # 先钉在 24.04（Zed 官方支持的环境）
          - os: ubuntu-24.04
            artifact: linux-x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS targets (universal binary)
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      # gpui 0.2 在 Linux 需要 wayland/xkbcommon/xcb/fontconfig 头文件
      # （blade 的 Vulkan 走 dlopen，编译期无需系统库）
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config file curl libssl-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libx11-dev \
            libwayland-dev wayland-protocols \
            libfontconfig1-dev libfreetype-dev

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Build (macOS universal)
        if: runner.os == 'macOS'
        run: |
          cargo build --release --locked --target aarch64-apple-darwin --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create -output dist/s3ui \
            target/aarch64-apple-darwin/release/s3ui \
            target/x86_64-apple-darwin/release/s3ui

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          cargo build --release --locked
          mkdir dist
          copy target\release\s3ui.exe dist\

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --release --locked 2>&1 | tee build.log
          mkdir -p dist
          cp target/release/s3ui dist/

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.artifact }}
          path: build.log
          if-no-files-found: ignore

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: s3ui-${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  # 打 v* tag 时:构建完成后自动创建 GitHub Release 并挂上三平台二进制
  release:
    name: Release ${{ github.ref_name }}
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rename binaries with version
        run: |
          cd artifacts
          v=${GITHUB_REF_NAME}
          mv s3ui-macos-universal/s3ui      "s3ui-$v-macos-universal"
          mv s3ui-windows-x86_64/s3ui.exe   "s3ui-$v-windows-x86_64.exe"
          mv s3ui-linux-x86_64/s3ui         "s3ui-$v-linux-x86_64"
          ls -R

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/s3ui-${{ github.ref_name }}-macos-universal
            artifacts/s3ui-${{ github.ref_name }}-windows-x86_64.exe
            artifacts/s3ui-${{ github.ref_name }}-linux-x86_64
          generate_release_notes: true
          # v0.1.0-rc1 这类带 "-" 的 semver 预发布版自动标记 prerelease
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
