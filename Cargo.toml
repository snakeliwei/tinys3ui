[workspace]
resolver = "2"
members = ["crates/s3-core", "crates/s3ui"]

# xattr 0.2.3 修复 fork（ENOATTR 在新版 libc 的 linux-gnu 目标已移除，上游
# 0.2 线停更）。详见 crates/xattr/Cargo.toml 顶部注释。
# 注意：刻意【不是】workspace member——zed-async-tar 只在 cfg(unix) 下依赖
# xattr，member 化会导致 Windows 强制构建这个 unix-only crate 而 E0433；
# path 依赖不被需要时不构建。gpui 升级后连同 crates/xattr 一并删除。
[patch.crates-io]
xattr = { path = "crates/xattr" }

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
s3-core = { path = "crates/s3-core" }
gpui = "0.2.2"
aws-sdk-s3 = { version = "1", features = ["behavior-version-latest"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
dirs = "5"
chrono = "0.4"

# 开发时更快重编译；发布体积优化
[profile.dev]
debug = 1

[profile.release]
lto = "thin"
strip = "symbols"
