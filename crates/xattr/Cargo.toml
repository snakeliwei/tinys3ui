# xattr 0.2.3 + ENOATTR 编译修复（本地 fork，经 [patch.crates-io] 覆盖官方源）
# 上游: https://github.com/Stebalien/xattr (0.2.3, MIT/Apache-2.0)
#
# 修复原因：gpui 0.2.2 → gpui_http_client → zed-async-tar 0.5.0-zed 锁定 xattr "0.2"，
# 而 0.2 线止于 0.2.3 且已停更。xattr 0.2.3 在 linux/android 无条件引用
# `libc::ENOATTR`，但新版 libc crate 的 linux-gnu 目标已不再暴露该常量
# （ENOATTR 与 ENODATA 均已移除），导致 Linux 构建报
#   error[E0425]: cannot find value `ENOATTR` in crate `::libc`
# macOS 不受影响（libc 在 apple 目标保留 ENOATTR），因此本 fork 仅改
# linux/android 分支，其余源码与 0.2.3 逐字节一致。
#
# 升级 gpui 若改用 xattr 1.x / 移除 zed-async-tar 后，可整体删除本目录
# 及根 Cargo.toml 的 [patch.crates-io] 段。

[package]
name = "xattr"
version = "0.2.3"
edition = "2015" # 上游 0.2.3 即 2015 语义，勿改
authors = ["Steven Allen <steven@stebalien.com>"]
description = "unix extended filesystem attributes"
documentation = "https://docs.rs/xattr"
keywords = [
    "xattr",
    "filesystem",
    "unix",
]
license = "MIT/Apache-2.0"
repository = "https://github.com/Stebalien/xattr"

[dependencies.libc]
version = "0.2"

[features]
default = ["unsupported"]
unsupported = []
